<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Académico de Ingeniería</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Ejercicios resueltos, apuntes y exámenes de ingeniería y ciencias básicas.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Tema visual sobrio y elegante (Vue o Buble) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Cargando portal académico...</div>

  <script>
    window.$docsify = {
      name: 'Portal de Ingeniería',
      repo: 'https://github.com/TU_USUARIO/TU_REPOSITORIO', // Reemplaza con tu enlace de GitHub
      loadSidebar: '_sidebar.md',
      loadNavbar: '_navbar.md',
      maxLevel: 4,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000, // Expansión de búsqueda de 1 día
        paths: 'auto',
        placeholder: 'Buscar apuntes, fórmulas o ejercicios...',
        noData: '¡No se encontró nada!',
        depth: 6
      }
    }
  </script>

  <!-- Docsify v4 y Plugins esenciales (Búsqueda y LaTeX/MathJax) -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <!-- Soporte para ecuaciones matemáticas en LaTeX -->
  <script src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
</body>
</html>
